<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de YouTube Gratis</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h1 { color: #c4302b; text-align: center; margin-top: 0; font-size: 24px; }
        label { font-weight: 600; font-size: 14px; color: #333; }
        .input-group { display: flex; gap: 8px; margin-top: 6px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px; }
        button.btn-aux { background: #0275d8; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .options { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        .radio-group { display: flex; gap: 15px; margin-bottom: 10px; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 100%; font-size: 14px; }
        .btn-submit { width: 100%; background: #2ea44f; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #2c974b; }
        .btn-submit:disabled { background: #94d3a2; cursor: not-allowed; }
        
        /* Contenedor y diseño de la Barra de Progreso */
        .progress-box { margin-top: 15px; display: none; }
        .progress-bar-bg { width: 100%; height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; position: relative; }
        .progress-bar-fill { width: 0%; height: 100%; background: #2ea44f; border-radius: 6px; transition: width 0.3s ease; }
        .progress-bar-fill.animated {
            background: linear-gradient(90deg, #2ea44f 25%, #5cd67c 50%, #2ea44f 75%);
            background-size: 200% 100%;
            animation: loadingAnimation 1.5s infinite linear;
        }

        @keyframes loadingAnimation {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .status { text-align: center; margin-top: 10px; font-size: 14px; color: #555; font-weight: 500; }
        .status.success { color: #2ea44f; font-weight: bold; }
        .status.error { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>DESCARGADOR YOUTUBE</h1>
    
    <label for="url">Introduce la URL del video:</label>
    <div class="input-group">
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
        <button class="btn-aux" onclick="pegarUrl()">📋 Pegar</button>
    </div>

    <div class="options">
        <div class="radio-group">
            <label><input type="radio" name="tipo" value="mp3" checked onchange="toggleCalidad(false)"> Solo Audio (MP3)</label>
            <label><input type="radio" name="tipo" value="mp4" onchange="toggleCalidad(true)"> Video (MP4)</label>
        </div>
        
        <div id="calidad-box" style="display: none; margin-top: 10px;">
            <label for="calidad">Calidad de video:</label>
            <select id="calidad">
                <option value="1080">1080p</option>
                <option value="720" selected>720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
            </select>
        </div>
    </div>

    <button class="btn-submit" id="btn-descargar" onclick="procesarDescarga()">Iniciar Descarga</button>
    
    <!-- Barra de progreso -->
    <div class="progress-box" id="progress-box">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill animated" id="progress-bar"></div>
        </div>
    </div>

    <div class="status" id="status">Estado: Esperando enlace...</div>
</div>

<script>
    const BACKEND_URL = "https://descargador-nd.onrender.com";

    async function pegarUrl() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('url').value = text;
        } catch (err) {
            alert('No se pudo acceder al portapapeles.');
        }
    }

    function toggleCalidad(mostrar) {
        document.getElementById('calidad-box').style.display = mostrar ? 'block' : 'none';
    }

    async function procesarDescarga() {
        const urlInput = document.getElementById('url');
        const url = urlInput.value.trim();
        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const calidad = document.getElementById('calidad').value;
        const btn = document.getElementById('btn-descargar');
        const status = document.getElementById('status');
        const progressBox = document.getElementById('progress-box');
        const progressBar = document.getElementById('progress-bar');

        if (!url) {
            alert("Por favor, introduce una URL válida de YouTube.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Procesando...";
        progressBox.style.display = "block";
        progressBar.style.width = "50%";
        progressBar.classList.add("animated");
        
        status.className = "status";
        status.innerText = "⏳ Descargando y convirtiendo en el servidor...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/download`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url, format: tipo, quality: calidad })
            });

            const data = await res.json();

            if (res.ok) {
                progressBar.style.width = "100%";
                progressBar.classList.remove("animated");

                status.className = "status success";
                status.innerText = `✅ ¡Descarga lista! Se guardará como: "${data.title}.${tipo}"`;
                
                // Forzar descarga única mediante enlace de descarga
                const fileUrl = `${BACKEND_URL}${data.download_url}`;
                const a = document.createElement("a");
                a.href = fileUrl;
                a.download = `${data.title}.${tipo}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                progressBar.style.width = "0%";
                status.className = "status error";
                status.innerText = "❌ Error: " + (data.detail || "No se pudo procesar el video");
            }
        } catch (e) {
            progressBar.style.width = "0%";
            status.className = "status error";
            status.innerText = "❌ Error de conexión con el servidor.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Iniciar Descarga";
        }
    }
</script>

</body>
</html>
